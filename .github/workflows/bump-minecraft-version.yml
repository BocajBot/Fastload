name: Bump Minecraft Version

on:
  workflow_dispatch:
    inputs:
      minecraft_version:
        description: "Target Minecraft version (example: 1.21.12)"
        required: true
        type: string
      yarn_mappings:
        description: "Target Yarn mappings (example: 1.21.12+build.1)"
        required: true
        type: string
      fabric_api_version:
        description: "Target Fabric API version (example: 0.142.0+1.21.12)"
        required: true
        type: string
      loader_version:
        description: "Fabric Loader version"
        required: true
        default: "0.18.4"
        type: string
      modmenu_version:
        description: "Mod Menu version"
        required: true
        default: "17.0.0-beta.2"
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v3

      - name: Apply version updates
        env:
          MINECRAFT_VERSION: ${{ inputs.minecraft_version }}
          YARN_MAPPINGS: ${{ inputs.yarn_mappings }}
          FABRIC_API_VERSION: ${{ inputs.fabric_api_version }}
          LOADER_VERSION: ${{ inputs.loader_version }}
          MODMENU_VERSION: ${{ inputs.modmenu_version }}
        run: |
          set -euo pipefail

          perl -0pi -e 's/^minecraft_version=.*/minecraft_version=$ENV{MINECRAFT_VERSION}/m' gradle.properties
          perl -0pi -e 's/^yarn_mappings=.*/yarn_mappings=$ENV{YARN_MAPPINGS}/m' gradle.properties
          perl -0pi -e 's/^fabric_api_version=.*/fabric_api_version=$ENV{FABRIC_API_VERSION}/m' gradle.properties
          perl -0pi -e 's/^loader_version=.*/loader_version=$ENV{LOADER_VERSION}/m' gradle.properties
          perl -0pi -e 's/^modmenu_version=.*/modmenu_version=$ENV{MODMENU_VERSION}/m' gradle.properties
          perl -0pi -e 's/^archives_base_name=.*/archives_base_name=Fastload+$ENV{MINECRAFT_VERSION}/m' gradle.properties

          perl -0pi -e 's/"minecraft": ">=([^"]+)"/"minecraft": ">=$ENV{MINECRAFT_VERSION}"/' src/main/resources/fabric.mod.json

          perl -0pi -e 's/matchesAny\("([^"]+)"\)/matchesAny("$ENV{MINECRAFT_VERSION}")/' src/main/java/io/github/bumblesoftware/fastload/api/abstraction/core/versioning/VersionConstants.java
          perl -0pi -e 's/new String\[\]\{"([^"]+)"\}/new String[]{"$ENV{MINECRAFT_VERSION}"}/' src/main/java/io/github/bumblesoftware/fastload/abstraction/Client1182.java
          perl -0pi -e 's/Fastload [0-9.]+ implementation selected/Fastload $ENV{MINECRAFT_VERSION} implementation selected/' src/main/java/io/github/bumblesoftware/fastload/init/FastloadClient.java
          perl -0pi -e 's/\*\*Minecraft [0-9.]+\*\*/**Minecraft $ENV{MINECRAFT_VERSION}**/' README.md

      - name: Build to validate changes
        run: ./gradlew build --stacktrace

      - name: Create pull request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore: bump to Minecraft ${{ inputs.minecraft_version }}"
          title: "chore: bump to Minecraft ${{ inputs.minecraft_version }}"
          body: |
            Automated Minecraft version bump generated by GitHub Actions.

            Updated:
            - `gradle.properties` dependency/version pins
            - `fabric.mod.json` Minecraft dependency floor
            - `VersionConstants`, `Client1182`, and `FastloadClient` version strings
            - `README.md` fork status

            Note: mixin callsites and runtime behavior still require manual in-game validation.
          branch: "codex/bump-${{ inputs.minecraft_version }}"
          labels: |
            chore
